name: setup-lyra-deps

description: Setup NDK and python for lyra build

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529"
        else
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529"
        fi
        python -m pip install --upgrade pip
        pip install numpy
